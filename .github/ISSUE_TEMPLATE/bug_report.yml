name: Bug report
description: Something in the gateway or dashboard doesn't work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Request or steps to reproduce
      description: The API call (model, endpoint, body) or the dashboard steps. Remove API keys and cookies.
      render: shell
  - type: textarea
    id: log
    attributes:
      label: Log
      description: The relevant lines from ~/.muse-gateway/server.log or the Activity → Log tab. Remove API keys and cookies.
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `muse-gateway --version`
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Windows and Node.js version
      placeholder: Windows 11, Node 22.12
