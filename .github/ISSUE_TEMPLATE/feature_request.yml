name: Feature request
description: Suggest something the gateway should do
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What do you want to do
      description: The task you're trying to get done, and what's in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could work
